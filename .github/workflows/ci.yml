name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Check plugin metadata is up to date
        run: npx openclaw plugins build --check --entry ./dist/index.js
      - name: Validate plugin
        run: npx openclaw plugins validate --entry ./dist/index.js
      - name: Test
        run: npm test
